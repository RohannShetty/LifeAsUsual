name: Bootstrap India-first editorial inventory
on:
  push:
    branches:
      - feat/india-first-editorial-audit-20261117
    paths:
      - .github/workflows/india-first-inventory-bootstrap.yml
permissions:
  contents: write
jobs:
  generate-baseline:
    if: github.repository == 'RohannShetty/LifeAsUsual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test inventory safety invariants
        run: node --test tests/india-first-audit.test.mjs
      - name: Generate complete audit snapshot
        run: node scripts/india-first-audit.mjs
      - name: Commit generated baseline to scoped feature branch
        run: |
          git add reports/india-first-inventory/legacy-inventory.csv reports/india-first-inventory/summary.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs(editorial): snapshot full inherited India-first review queue"
            git push origin HEAD:feat/india-first-editorial-audit-20261117
          fi