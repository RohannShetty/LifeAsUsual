name: India-first editorial inventory
on:
  push:
    branches:
      - master
      - feat/india-first-editorial-audit-20261117
    paths:
      - scripts/india-first-audit.mjs
      - scripts/verify-inventory.ts
      - tests/india-first-audit.test.mjs
      - tests/verify-inventory.test.mjs
      - reports/india-first-inventory/**
      - .github/workflows/india-first-inventory*.yml
  pull_request:
    paths:
      - scripts/india-first-audit.mjs
      - scripts/verify-inventory.ts
      - tests/india-first-audit.test.mjs
      - tests/verify-inventory.test.mjs
      - reports/india-first-inventory/**
      - .github/workflows/india-first-inventory*.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test legacy ID and review safeguards
        run: node --test tests/india-first-audit.test.mjs
      - name: Test inventory progress summary
        run: node --experimental-strip-types --test tests/verify-inventory.test.mjs
      - name: Check deterministic full inventory
        run: node scripts/india-first-audit.mjs --check
      - name: Verify inventory coverage and review queue
        run: node --experimental-strip-types scripts/verify-inventory.ts