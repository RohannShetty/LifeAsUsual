name: Candidate framework upgrade validation

on:
  push:
    branches: [security/astro-zod-upgrade]

permissions:
  contents: write

concurrency:
  group: candidate-framework-upgrade
  cancel-in-progress: true

jobs:
  validate-and-lock:
    name: Upgrade, test, and commit validated lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install existing locked dependencies
        run: npm ci

      - name: Upgrade exact candidate versions on isolated branch
        run: |
          npm install --save-exact astro@7.4.4 zod@4.6.7
          npm install --save-dev --save-exact @astrojs/check@0.9.12
          npm ls astro zod @astrojs/check --depth=0

      - name: Validate India content and TypeScript
        run: npm run check

      - name: Build static site with Pagefind
        run: npm run build

      - name: Check source-edition term safety
        run: npm run scan:terms

      - name: Check current production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium

      - name: Run full browser regression matrix
        run: npx playwright test

      - name: Commit only validated manifest and lockfile to upgrade branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore(deps): upgrade Astro 7.4.4 Zod 4.6.7 and check tools"
          git push origin HEAD:security/astro-zod-upgrade
