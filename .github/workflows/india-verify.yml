name: India edition verification

on:
  push:
    branches:
      - master
      - rewrite/india-edition
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify India edition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate India manifest and chapter data
        run: npm run verify:india

      - name: Type-check Astro project
        run: npm run check

      - name: Build the site
        run: npm run build

      - name: Scan built HTML for source-edition terms
        run: npm run scan:terms

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
