name: India edition verification

on:
  push:
    branches:
      - master
      - rewrite/india-edition
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Only the latest revision of a pull request needs a full browser-test run.
# Keep the master-branch verification group separate from each PR.
concurrency:
  group: india-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify India edition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify immutable GitHub Actions references
        run: npm run verify:actions && node --test tests/verify-actions-pinned.test.mjs

      - name: Validate India manifest and chapter data
        run: npm run verify:india

      - name: Type-check Astro project
        run: npm run check

      - name: Build the site
        run: npm run build

      - name: Verify sitemap and robots generation
        run: node --test tests/build-sitemap.test.mjs

      - name: Check fragment links and duplicate anchor ids
        run: npm run check:anchors

      - name: Scan every built page for source-edition terms
        run: npm run scan:terms -- --final

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
